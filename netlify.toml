[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# OCTO API proxy functions will live here (see build sequence step 7).
[functions]
  directory = "netlify/functions"

# --- Per-deploy Lighthouse self-reporting --------------------------------------
# Runs Lighthouse against the built site on EVERY deploy and prints the scores in
# the deploy log (Deploys → a deploy → the "Lighthouse" plugin section). Netlify
# auto-installs the plugin from its registry — no package.json dependency needed.
# Audits the two key pages: the homepage (City River Tour hero) and the standalone
# /tour/city-river-tours page. Paths are relative to the publish dir (`dist`); Astro's
# build format is 'file' (astro.config.mjs), so routes emit `<route>.html`.
#
# REPORT-ONLY BY DESIGN — no `thresholds`, so a low score never fails the deploy:
#   • Branch/preview deploys are noindex (see [context.*] below), which tanks the
#     SEO category artificially — a hard SEO gate would fail every non-prod build.
#   • CI-runner perf varies run to run.
# The real "Lighthouse ≥90 perf on key pages" gate is a human launch check
# (docs/launch-checklist.md), read against the PRODUCTION deploy's log.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [[plugins.inputs.audits]]
    path = "index.html"
    # Homepage — City River Tour is the default hero (AGENTS rule 3).

  [[plugins.inputs.audits]]
    path = "tour/city-river-tours.html"
    # Standalone City River Tour page — the LCP-tuned booking page.

# --- Legacy Craft URL redirects (301) -----------------------------------------
# All permanent (301). `force` is intentionally OMITTED (defaults to false) so a
# redirect NEVER shadows a real page — if a file exists at the `from` path,
# Netlify serves it instead of redirecting. Netlify matches redirects
# trailing-slash-insensitively, so each rule covers both `/path` and `/path/`.
# Netlify evaluates rules IN ORDER, first match wins — which is why the explicit
# `/cruises/<slug>` rules below must precede the `/cruises/*` splat.
#
# ⚠ THE /tour/ PRODUCT NAMESPACE IS NOT REDIRECTED — IT IS ADOPTED.
#   Product pages now RENDER at their exact legacy addresses (/tour/<legacy-slug>,
#   e.g. /tour/mamma-mia-cruise-abba-tribute), so those URLs never moved and need
#   no rule. Anything below under /tour/ is a genuinely-retired legacy path
#   (a category facet, or a product that lives at a top-level page instead).
#   See docs/url-parity.md for the full decision table and slug mapping.
#
# ⚠ STILL TO COMPLETE from Simon's Google Search Console / GA export before
#   launch: malformed or historic slug variants, and any blog/news section the
#   Craft sitemap never listed. See docs/launch-checklist.md → "URL redirect map".

# --- Our own history: /cruises/* → /tour/* ------------------------------------
# The new site briefly shipped products at /cruises/[slug]. Staging links, shared
# previews and internal bookmarks must not 404. Explicit rules first for the 12
# products whose slug ALSO changed (to the legacy slug), then a splat for the 8
# whose slug was already identical. Every one of these lands on a real page in a
# single hop — no chains.
[[redirects]]
  from = "/cruises/abba-tribute-cruise"
  to = "/tour/mamma-mia-cruise-abba-tribute"
  status = 301

[[redirects]]
  from = "/cruises/back-to-the-90s"
  to = "/tour/back-to-90s"
  status = 301

[[redirects]]
  from = "/cruises/decks-on-deck"
  to = "/tour/decks-on-deck-day-party"
  status = 301

[[redirects]]
  from = "/cruises/diana-ross-cruise"
  to = "/tour/diana-ross-the-supreme-experience"
  status = 301

[[redirects]]
  from = "/cruises/elvis-live-cruise"
  to = "/tour/elvis-live"
  status = 301

[[redirects]]
  from = "/cruises/elvis-rocks-cruise"
  to = "/tour/elvis-rocks"
  status = 301

[[redirects]]
  from = "/cruises/fathers-day-cruise"
  to = "/tour/fathers-day"
  status = 301

[[redirects]]
  from = "/cruises/mothers-day-cruise"
  to = "/tour/mothering-sunday"
  status = 301

[[redirects]]
  from = "/cruises/pirates-and-mermaids"
  to = "/tour/pirates-and-mermaid-cruise"
  status = 301

[[redirects]]
  from = "/cruises/santa-cruise"
  to = "/tour/father-christmas-cruise"
  status = 301

[[redirects]]
  from = "/cruises/soul-river-cruise"
  to = "/tour/soul-river"
  status = 301

[[redirects]]
  from = "/cruises/swinging-on-the-river"
  to = "/tour/swing-cruise-live-music"
  status = 301

# GA confirms /tour/wizards-and-fairies-cruise carried real traffic (517 sessions,
# £1,236) despite being absent from the Craft sitemap — so the draft event adopts
# that slug too. Must precede the splat, which would otherwise 404 on the old path.
#
# ⚠ KNOWN TRANSIENT 2-HOP: this rule points at the correct FINAL destination, but
#   that destination is itself temporarily redirected to /whats-on further down
#   (the draft-event net), so today the path is
#     /cruises/wizards-and-fairies → /tour/wizards-and-fairies-cruise → /whats-on
#   This is deliberate. The alternative — pointing straight at /whats-on — would be
#   a rule that silently becomes WRONG once the event is published. Publishing the
#   event removes the middle hop automatically and needs no edit here.
[[redirects]]
  from = "/cruises/wizards-and-fairies"
  to = "/tour/wizards-and-fairies-cruise"
  status = 301

# Slug was already identical (adele-cruise, boat-tropicana, dolly-cruise,
# rollin-on-the-river, broadway-boat-party, club-classics-cruise,
# halloween-boat-party) — only the namespace moved.
[[redirects]]
  from = "/cruises/*"
  to = "/tour/:splat"
  status = 301

[[redirects]]
  from = "/cruises"
  to = "/events"
  status = 301

# --- Bare namespace root -------------------------------------------------------
# /tour has no index page (products are leaves); the Events hub is the closest
# thing to a product index.
[[redirects]]
  from = "/tour"
  to = "/events"
  status = 301

# --- CRT + ferry: ADOPTED, so these are pages and NOT redirects ---------------
# /tour/city-river-tours and /tour/boat-to-old-trafford now RENDER — the namespace
# adoption is complete. Their former rules were deleted; the rules below send our
# own previous paths at the adopted ones. Ferry point pages nest beneath the
# landing page, so a splat covers /ralli-quay and /stephensons-bridge. The splat
# precedes the bare rule (first match wins).
[[redirects]]
  from = "/city-river-tour"
  to = "/tour/city-river-tours"
  status = 301

[[redirects]]
  from = "/boat-to-old-trafford/*"
  to = "/tour/boat-to-old-trafford/:splat"
  status = 301

[[redirects]]
  from = "/boat-to-old-trafford"
  to = "/tour/boat-to-old-trafford"
  status = 301

