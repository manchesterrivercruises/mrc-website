# --- Wizards & Fairies: interim net while the event is draft ------------------
# The event has adopted /tour/wizards-and-fairies-cruise but is still draft: true,
# so it does not render yet — and GA shows the legacy URL earning real traffic
# (517 sessions, £1,236). Without this, launching would 404 that demand.
# SELF-HEALING: `force` is omitted, so the moment the event is published the real
# page exists and Netlify serves it INSTEAD of this rule. No cleanup required —
# but publishing the event is the actual fix. See docs/url-parity.md.
[[redirects]]
  from = "/tour/wizards-and-fairies-cruise"
  to = "/whats-on"
  status = 301

# --- Pirates & Mermaids: interim net while the event is shelved ----------------
# Shelved for this year (draft: true, 2026-09-01) — the product is not running, so
# /tour/pirates-and-mermaid-cruise stops building. The legacy path is the single
# highest-value event URL we hold (GA: £5.6k over 2.5 years), so leaving it to 404
# would be the most expensive possible way to shelve a product.
# SELF-HEALING, exactly as the Wizards rule above: `force` is omitted, so republishing
# the event makes the real page exist and Netlify serves it INSTEAD of this rule. No
# cleanup needed here — un-drafting the event IS the fix. See docs/url-parity.md.
#
# NOTE the resulting 2-hop for the legacy Craft path, which is deliberate and matches
# Wizards: /cruises/pirates-and-mermaids → /tour/pirates-and-mermaid-cruise → /whats-on.
# Pointing the first hop straight at /whats-on would silently become WRONG on republish.
[[redirects]]
  from = "/tour/pirates-and-mermaid-cruise"
  to = "/whats-on"
  status = 301

