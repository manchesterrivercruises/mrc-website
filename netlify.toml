[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# OCTO API proxy functions will live here (see build sequence step 7).
[functions]
  directory = "netlify/functions"

# --- Per-deploy Lighthouse self-reporting --------------------------------------
# Runs Lighthouse against the built site on EVERY deploy and prints the scores in
# the deploy log (Deploys → a deploy → the "Lighthouse" plugin section). Netlify
# auto-installs the plugin from its registry — no package.json dependency needed.
# Audits the two key pages: the homepage (City River Tour hero) and the standalone
# /city-river-tour page. Paths are relative to the publish dir (`dist`); Astro's
# default 'directory' build format emits `<route>/index.html`.
#
# REPORT-ONLY BY DESIGN — no `thresholds`, so a low score never fails the deploy:
#   • Branch/preview deploys are noindex (see [context.*] below), which tanks the
#     SEO category artificially — a hard SEO gate would fail every non-prod build.
#   • CI-runner perf varies run to run.
# The real "Lighthouse ≥90 perf on key pages" gate is a human launch check
# (docs/launch-checklist.md), read against the PRODUCTION deploy's log.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [[plugins.inputs.audits]]
    path = "index.html"
    # Homepage — City River Tour is the default hero (AGENTS rule 3).

  [[plugins.inputs.audits]]
    path = "city-river-tour/index.html"
    # Standalone City River Tour page — the LCP-tuned booking page.

# --- Legacy Craft URL redirects (301) -----------------------------------------
# All permanent (301). `force` is intentionally OMITTED (defaults to false) so a
# redirect NEVER shadows a real page — if a file exists at the `from` path,
# Netlify serves it instead of redirecting. Netlify matches redirects
# trailing-slash-insensitively, so each rule covers both `/path` and `/path/`.
# Netlify evaluates rules IN ORDER, first match wins — which is why the explicit
# `/cruises/<slug>` rules below must precede the `/cruises/*` splat.
#
# ⚠ THE /tour/ PRODUCT NAMESPACE IS NOT REDIRECTED — IT IS ADOPTED.
#   Product pages now RENDER at their exact legacy addresses (/tour/<legacy-slug>,
#   e.g. /tour/mamma-mia-cruise-abba-tribute), so those URLs never moved and need
#   no rule. Anything below under /tour/ is a genuinely-retired legacy path
#   (a category facet, or a product that lives at a top-level page instead).
#   See docs/url-parity.md for the full decision table and slug mapping.
#
# ⚠ STILL TO COMPLETE from Simon's Google Search Console / GA export before
#   launch: malformed or historic slug variants, and any blog/news section the
#   Craft sitemap never listed. See docs/launch-checklist.md → "URL redirect map".

# --- Our own history: /cruises/* → /tour/* ------------------------------------
# The new site briefly shipped products at /cruises/[slug]. Staging links, shared
# previews and internal bookmarks must not 404. Explicit rules first for the 12
# products whose slug ALSO changed (to the legacy slug), then a splat for the 8
# whose slug was already identical. Every one of these lands on a real page in a
# single hop — no chains.
[[redirects]]
  from = "/cruises/abba-tribute-cruise"
  to = "/tour/mamma-mia-cruise-abba-tribute"
  status = 301

[[redirects]]
  from = "/cruises/back-to-the-90s"
  to = "/tour/back-to-90s"
  status = 301

[[redirects]]
  from = "/cruises/decks-on-deck"
  to = "/tour/decks-on-deck-day-party"
  status = 301

